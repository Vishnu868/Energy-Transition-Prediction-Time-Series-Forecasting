<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Energy Trip AI — Upload</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body class="upload-page">

    <header>
        <div class="logo">⚡ EnergyTripAI</div>
        <nav>
            <a href="index.html" class="active">Upload</a>
            <a href="dashboard.html">Dashboard</a>
        </nav>
    </header>

    <main class="upload-container">
        <div class="upload-card">
            <h1>Early Power Trip Prediction</h1>
            <p class="subtitle">Upload your appliance power CSV and configure your electrical parameters to get AI-powered trip predictions.</p>

            <!-- File Upload Zone -->
            <div class="drop-zone" id="dropZone">
                <div class="drop-icon">📂</div>
                <p>Drag & drop your CSV file here, or click to browse</p>
                <p class="hint">Supported format: UK-DALE or any CSV with timestamp + power columns</p>
                <input type="file" id="fileInput" accept=".csv" hidden />
            </div>
            <div id="fileInfo" class="file-info hidden"></div>

            <!-- Configuration Panel -->
            <div class="config-panel">
                <div class="config-row">
                    <div class="config-field">
                        <label for="breakerRating">Breaker Rating (Amps)</label>
                        <input type="number" id="breakerRating" value="15" min="1" max="400" step="0.5" />
                    </div>
                    <div class="config-field">
                        <label for="voltage">System Voltage (V)</label>
                        <input type="number" id="voltage" value="230" min="100" max="480" />
                    </div>
                </div>

                <div class="config-row">
                    <div class="config-field">
                        <label for="locationType">Location Type</label>
                        <select id="locationType">
                            <option value="home">🏠 Home</option>
                            <option value="office">🏢 Office</option>
                            <option value="hospital">🏥 Hospital</option>
                            <option value="factory">🏭 Factory</option>
                            <option value="school">🏫 School</option>
                        </select>
                    </div>
                    <div class="config-field">
                        <label for="resampleFreq">Resample Frequency</label>
                        <select id="resampleFreq">
                            <option value="1s">1 second</option>
                            <option value="5s" selected>5 seconds</option>
                            <option value="10s">10 seconds</option>
                            <option value="30s">30 seconds</option>
                            <option value="1T">1 minute</option>
                        </select>
                    </div>
                </div>

                <div class="config-row">
                    <div class="config-field">
                        <label for="forecastSteps">Forecast Steps (future timesteps)</label>
                        <input type="number" id="forecastSteps" value="10" min="1" max="100" />
                    </div>
                </div>
            </div>

            <button class="btn-analyze" id="analyzeBtn" disabled>
                ⚡ Analyze Power Data
            </button>

            <div id="uploadStatus" class="status-msg hidden"></div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
